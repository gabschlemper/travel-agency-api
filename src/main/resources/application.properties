# Configurações do servidor
server.port=8080

# Nome da aplicação
spring.application.name=api-viagem

# Configuração do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/agencia_viagem
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Configuração de logging
logging.level.com.agenciaviagem=INFO
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JWT Secret (em produção, use variável de ambiente)
jwt.secret=c2VjcmV0LWtleS1hZ2VuY2lhLXZpYWdlbS0yMDI1LXNlY3VyaXR5LWp3dC10b2tlbi1zZWNyZXQ=
jwt.expiration=86400000
